<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="description" content="Beacon: live quizzes and Family Feud for your group."><meta name="theme-color" content="#0A0E1C"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E8A93D'/%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beacon Family Feud</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="lamp.css"><link rel="stylesheet" href="beacon-theme.css">
<style>.tr{--c:#FF6B6B}.tb{--c:#5AA9FF}.band{padding:12px;border-radius:16px;font-weight:800;text-align:center;background:color-mix(in srgb,var(--c) 22%,transparent);border:1.5px solid var(--c);color:var(--c)}
.em{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.em button{font-size:1.6rem;padding:8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}.em button.on{border-color:var(--accent2);background:var(--surface-2)}
.buzz{width:240px;height:240px;border-radius:50%;border:0;font:inherit;font-size:2.4rem;font-weight:800;background:var(--c);color:#1A1000;box-shadow:0 22px 40px -10px var(--c),inset 0 -10px 0 rgba(0,0,0,.18);margin:12px auto;display:block}.buzz:active{transform:translateY(6px)}
#play{text-align:center;display:flex;flex-direction:column;gap:14px}</style></head>
<body><main>
<section id="join"><div id="brand"></div><h1 style="text-align:center;font-size:1.4rem">Family Feud</h1>
<input id="code" inputmode="numeric" maxlength="6" placeholder="Team code" aria-label="Team code" autocomplete="off">
<input id="nick" maxlength="20" placeholder="Your name" aria-label="Your name" autocomplete="off">
<p class="small">Pick your emoji</p><div class="em" id="em"></div>
<button class="primary" id="go">Join</button><p id="msg" class="err" role="alert"></p>
<p class="small" style="text-align:center">Your team code puts you on Red or Blue automatically.</p></section>
<section id="game" class="hide"><div id="play"></div><button class="alt" id="callbtn" style="margin-top:14px">Join call (audio)</button><div id="call"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="lamp.js"></script><script src="call.js"></script>
<script>
const EM=['🦁','🐑','🕊️','🔥','⭐','🙏','👑','🌟','🎺','🌿','🕯️','🛡️'];
const ERR={nickname_taken:'That name is taken. Try another one.',invalid_code:"We couldn't find that code. Check the screen and try again.",bad_nickname:'Please use 2 to 20 characters for your name.',bad_emoji:'Please pick an emoji.',net:'Connection problem. Try again.'};
let gid,T,D,me,em=EM[0],drawn='';
g('brand').innerHTML=wordmark();
g('em').innerHTML=EM.map((e,i)=>`<button type="button" data-e="${e}" class="${i?'':'on'}" aria-label="Emoji ${e}">${e}</button>`).join('');
g('em').onclick=e=>{const b=e.target.closest('button');if(!b)return;em=b.dataset.e;g('em').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
async function anon(){const{data:{session}}=await sb.auth.getSession();if(!session){const{error}=await sb.auth.signInAnonymously();if(error)throw error}}
async function tryJoin(code,nick,emoji){try{await anon();const{data,error}=await sb.rpc('feud_join',{p_code:code,p_nick:nick,p_emoji:emoji});if(error||!data)return'net';if(!data.ok)return data.error;
 localStorage.feud=JSON.stringify({code,nick,emoji});gid=data.game_id;T=data.team;me=data;g('join').classList.add('hide');g('game').classList.remove('hide');
 sb.channel('f'+gid).on('postgres_changes',{event:'UPDATE',schema:'public',table:'feud_games',filter:'id=eq.'+gid},refresh).subscribe();setInterval(refresh,3000);refresh();return''}catch(e){return'net'}}
g('go').onclick=async()=>{g('msg').textContent='';g('go').disabled=true;const e=await tryJoin(g('code').value.trim(),g('nick').value,em);g('go').disabled=false;if(e)g('msg').textContent=ERR[e]||ERR.net};
(async()=>{loadTheme();const s=localStorage.feud&&JSON.parse(localStorage.feud);if(s){const e=await tryJoin(s.code,s.nick,s.emoji);if(e==='invalid_code')localStorage.removeItem('feud')}})();
async function refresh(){const{data}=await sb.from('feud_games').select('question,status,buzzed_team,buzzed_by,active').eq('id',gid).single();if(data){D=data;draw()}}
function draw(){const k=[D.status,D.buzzed_by,D.active,D.question].join();if(k===drawn)return;drawn=k;
 let body;
 if(!D.active)body='<h2>This game has ended.</h2><p>Ask the host for a new team code.</p>';
 else if(D.status==='open')body='<button class="buzz" id="buzz">BUZZ</button><p>Be fast! First team to buzz answers.</p>';
 else if(D.status==='buzzed')body=`<h2>${esc(D.buzzed_by)} buzzed first!</h2><p>${D.buzzed_team===T?'Your team answers now.':'The other team answers.'}</p>`;
 else body='<h2>Buzzers locked</h2><p>Wait for the host to ask the question.</p>';
 g('play').className='t'+T[0];
 g('play').innerHTML=`<div class="band">${T==='red'?'RED':'BLUE'} TEAM</div><div style="font-size:3rem">${esc(me.emoji)}</div><b>${esc(me.nickname)}</b><h2>${esc(D.question)}</h2>${body}`}
g('callbtn').onclick=()=>Call.toggle(g('call'),gid,true);
g('play').onclick=async e=>{if(!e.target.closest('#buzz'))return;navigator.vibrate&&navigator.vibrate(60);const{data}=await sb.rpc('feud_buzz',{p_game:gid});drawn='';refresh()};
</script><script src="fx.js" defer></script><script src="bg3d.js" defer></script><script src="shell.js" defer></script></body></html>
