<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="description" content="Beacon: live quizzes and Family Feud for your group."><meta name="theme-color" content="#0A0E1C"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E8A93D'/%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beacon Family Feud</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="lamp.css"><link rel="stylesheet" href="beacon-theme.css"><link rel="stylesheet" href="feud-ui.css">
<style>.tr{--c:#FF6B6B}.tb{--c:#5AA9FF}.band{padding:12px;border-radius:16px;font-weight:800;text-align:center;background:color-mix(in srgb,var(--c) 22%,transparent);border:1.5px solid var(--c);color:var(--c)}
.em{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.em button{font-size:1.6rem;padding:8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}.em button.on{border-color:var(--accent2);background:var(--surface-2)}
.buzz{width:240px;height:240px;border-radius:50%;border:0;font:inherit;font-size:2.4rem;font-weight:800;background:var(--c);color:#1A1000;box-shadow:0 22px 40px -10px var(--c),inset 0 -10px 0 rgba(0,0,0,.18);margin:12px auto;display:block}.buzz:active{transform:translateY(6px)}
#play{text-align:center;display:flex;flex-direction:column;gap:14px}</style></head>
<body><main>
<section id="join"><div id="brand"></div><h1 style="text-align:center;font-size:1.4rem">Family Feud</h1>
<input id="code" inputmode="numeric" maxlength="6" placeholder="Team code" aria-label="Team code" autocomplete="off">
<input id="nick" maxlength="20" placeholder="Your name" aria-label="Your name" autocomplete="off">
<p class="small">Pick your character</p><div class="avpick" id="em"></div><p class="small avnote" id="lknote"></p>
<button class="primary" id="go">Join</button><p id="msg" class="err" role="alert"></p>
<p class="small" style="text-align:center">Your team code puts you on Red or Blue automatically.</p></section>
<section id="game" class="hide"><div id="play"></div><button class="alt" id="callbtn" style="margin-top:14px">Join call (audio)</button><div id="call"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="lamp.js"></script><script src="feud-ui.js"></script><script src="call.js"></script><script src="sound.js"></script><script src="react.js"></script><script src="celebrate.js"></script><script src="spline.js"></script>
<script>
const EM=window.AVATARS;
const ERR={nickname_taken:'That name is taken. Try another one.',invalid_code:"We couldn't find that code. Check the screen and try again.",bad_nickname:'Please use 2 to 20 characters for your name.',bad_emoji:'Please pick an emoji.',net:'Connection problem. Try again.'};
let gid,T,D,me,uid,em=EM[0],drawn='',TSEQ=-1,TSTART=0,PK;
g('brand').innerHTML=wordmark();
PK=Av.picker(g('em'),g('lknote'),{cur:em,level:1,onPick:e=>{em=e}});Av.level().then(l=>{PK.level=l});
async function anon(){const{data:{session}}=await sb.auth.getSession();if(!session){const{error}=await sb.auth.signInAnonymously();if(error)throw error}const{data:{user}}=await sb.auth.getUser();uid=user&&user.id}
async function tryJoin(code,nick,emoji){try{await anon();const{data,error}=await sb.rpc('feud_join',{p_code:code,p_nick:nick,p_emoji:emoji});if(error||!data)return'net';if(!data.ok)return data.error;
 localStorage.feud=JSON.stringify({code,nick,emoji});gid=data.game_id;T=data.team;me=data;g('join').classList.add('hide');g('game').classList.remove('hide');
 sb.channel('f'+gid).on('postgres_changes',{event:'UPDATE',schema:'public',table:'feud_games',filter:'id=eq.'+gid},refresh).subscribe();setInterval(refresh,3000);refresh();return''}catch(e){return'net'}}
g('go').onclick=async()=>{g('msg').textContent='';g('go').disabled=true;const e=await tryJoin(g('code').value.trim(),g('nick').value,em);g('go').disabled=false;if(e)g('msg').textContent=ERR[e]||ERR.net};
(async()=>{loadTheme();const s=localStorage.feud&&JSON.parse(localStorage.feud);if(s){const e=await tryJoin(s.code,s.nick,s.emoji);if(e==='invalid_code')localStorage.removeItem('feud')}})();
async function refresh(){const{data}=await sb.from('feud_games').select('question,status,buzzed_team,buzzed_by,active,mode,phase,ctrl_team,bank,strikes,turn_user,turn_name,fo_names,fo_red,fo_blue,has_pending,last_try,red_score,blue_score,turn_seq,turn_secs').eq('id',gid).single();if(data){D=data;if(D.turn_seq!==TSEQ){TSEQ=D.turn_seq;TSTART=Date.now()}draw()}}
function draw(){const k=JSON.stringify(D);if(k===drawn)return;drawn=k;
 const mine=!!uid&&D.turn_user===uid,lt=D.last_try,myName=me.emoji+' '+me.nickname,isFo=!!uid&&(uid===D.fo_red||uid===D.fo_blue),other=D.ctrl_team==='red'?'BLUE':'RED';
 const form=(msg,btn)=>`<h2>${msg}</h2><input id="ans" maxlength="60" placeholder="Type your answer" autocomplete="off" aria-label="Your answer"><button class="primary" id="send">${btn}</button><p id="fm" class="err" role="alert"></p>`;
 const last=lt?`<p class="small">${esc(lt.name)}: &ldquo;${esc(lt.text)}&rdquo; ${lt.res==='hit'?'&#10003; +'+lt.pts:lt.res==='miss'?'&#10007;':'&hellip; the host is checking'}</p>`:'';
 let body;
 if(!D.active)body='<h2>This game has ended.</h2><p>Ask the host for a new team code.</p>';
 else if(D.mode!=='auto'){
  if(D.status==='open')body='<button class="buzz" id="buzz">BUZZ</button><p>Be fast! First team to buzz answers.</p>';
  else if(D.status==='buzzed')body=`<h2>${esc(D.buzzed_by)} buzzed first!</h2><p>${D.buzzed_team===T?'Your team answers now.':'The other team answers.'}</p>`;
  else body='<h2>Buzzers locked</h2><p>Wait for the host to ask the question.</p>'}
 else if(D.has_pending&&mine)body=`<h2>So close!</h2><p>The host is checking your answer&hellip;</p>`;
 else if(D.phase==='faceoff'&&D.status==='open')body=isFo?'<button class="buzz" id="buzz">BUZZ</button><p>You are in the face-off! Buzz first, then type your answer.</p>':`<h2>Face-off!</h2><p>${esc(D.fo_names||'')}</p><p class="small">Cheer your player on. Your turn comes next.</p>`;
 else if(mine&&D.phase==='faceoff')body=form('You buzzed in! Type your answer','Send answer');
 else if(mine&&D.phase==='play')body=form('Your turn! Type an answer','Send answer');
 else if(mine&&D.phase==='steal')body=form('STEAL! One guess to take the points','Steal it');
 else if(D.phase==='faceoff')body=`<h2>${esc(D.turn_name||D.buzzed_by||'')} is answering&hellip;</h2><p class="small">Face-off</p>`;
 else if(D.phase==='play')body=`<h2>${esc(D.turn_name||'')} is answering</h2><p>${D.ctrl_team===T?'Your team is playing the round.':'The other team is playing. Stay ready to steal.'}</p><p class="small">Strikes: ${'&#10007; '.repeat(D.strikes||0)||'none'}</p>`;
 else if(D.phase==='steal')body=`<h2>STEAL!</h2><p>${esc(D.turn_name||'')} has one guess to take the bank.</p>`;
 else if(D.phase==='over')body=`<h2>Round over</h2><p>Red ${D.red_score} &middot; Blue ${D.blue_score}</p>`;
 else body='<h2>Get ready</h2><p>Waiting for the host to start the face-off.</p>';
 const mood=mine?'hop':(lt&&lt.name===myName?(lt.res==='hit'?'cheer':lt.res==='miss'?'shake':'think'):'');
 g('play').className='t'+T[0];
 g('play').innerHTML=`<div class="band">${T==='red'?'RED':'BLUE'} TEAM &middot; ${D.red_score||0} - ${D.blue_score||0}</div>${Av.html(me.emoji,{size:92,cls:mood,name:me.nickname})}${mine&&D.turn_secs>0&&!D.has_pending&&D.phase!=='over'?'<div class="tbar" id="tb"><i></i></div>':''}<b>${esc(me.nickname)}</b><h2>${esc(D.question)}</h2>${body}${last}`;
 if(mine&&g('ans'))setTimeout(()=>{const a=g('ans');a&&a.focus()},50)}
g('callbtn').onclick=()=>Call.toggle(g('call'),gid,true);
setInterval(()=>{const b=g('tb');if(!b||!D||!(D.turn_secs>0))return;const fr=Math.max(0,1-(Date.now()-TSTART)/1000/D.turn_secs);b.firstChild.style.width=(fr*100)+'%';b.classList.toggle('low',fr<.3)},250);
async function sendAns(){const a=g('ans');if(!a||!a.value.trim())return;const b=g('send');b.disabled=true;
 const{data,error}=await sb.rpc('feud_submit',{p_game:gid,p_text:a.value});
 if(error||!data||!data.ok){b.disabled=false;g('fm').textContent=data&&data.error==='not_your_turn'?'It is not your turn any more.':'Could not send. Try again.';drawn='';refresh();return}
 if(data.res==='hit'&&navigator.vibrate)navigator.vibrate([60,40,60]);drawn='';refresh()}
g('play').onclick=async e=>{if(e.target.closest('#send')){sendAns();return}if(!e.target.closest('#buzz'))return;navigator.vibrate&&navigator.vibrate(60);await sb.rpc('feud_buzz',{p_game:gid});drawn='';refresh()};
g('play').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='ans')sendAns()};
</script><script src="fx.js" defer></script><script src="bg3d.js" defer></script><script src="shell.js" defer></script><script>React.listen(()=>typeof gid!=='undefined'&&gid?'react-feud-'+gid:null);</script></body></html>
